<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: #dfa849;
            --gold-light: #fef0cd;
            --gold-dark: #8a6519;
            --maroon: #4a0d13;
            --bg-color: #1a0507;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Manjari', sans-serif;
            background: radial-gradient(circle at 50% 20%, #2e080e, var(--bg-color));
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        /* Ambient floating petals */
        .ambient-petals {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            background: #ff5e7e;
            border-radius: 150% 0 150% 0;
            opacity: 0.25;
            animation: fall 12s linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.35; }
            100% { transform: translate(100px, 110vh) rotate(360deg); opacity: 0; }
        }

        /* Floating Music Toggle */
        .music-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 99;
            background: rgba(46, 8, 14, 0.85);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.3s;
        }
        .music-btn:hover {
            transform: scale(1.05);
            background: rgba(74, 13, 19, 0.95);
        }
        .wave-bar {
            width: 3px;
            height: 14px;
            background: var(--gold);
            border-radius: 2px;
            display: inline-block;
        }
        .playing .wave-bar {
            animation: bounce 0.8s ease infinite alternate;
        }
        .playing .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 10;
        }

        .header-title {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: var(--gold);
            text-shadow: 0 2px 10px rgba(223, 168, 73, 0.4);
            margin-bottom: 5px;
        }

        .sub-title {
            letter-spacing: 3px;
            font-size: 12px;
            color: var(--gold-light);
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* Miniature Cartoon Couple */
        .couple-wrapper {
            margin: 20px auto 30px;
            width: 220px;
            height: 150px;
            position: relative;
        }
        .mini-couple {
            width: 100%;
            height: 100%;
            animation: romanticSway 3.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        @keyframes romanticSway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .floating-heart {
            position: absolute;
            color: #ff3366;
            font-size: 16px;
            animation: floatHeart 2.5s ease-in infinite;
        }
        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
        }

        /* Scratch Card Section */
        .scratch-card-box {
            position: relative;
            width: 320px;
            height: 220px;
            margin: 0 auto 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(223, 168, 73, 0.25);
            border: 2px solid var(--gold);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Revealed Content Beneath */
        .scratch-secret {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2e080e, #1a0507);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-radius: 16px;
        }
        .secret-badge {
            background: rgba(223, 168, 73, 0.2);
            color: var(--gold);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid var(--gold);
            margin-bottom: 8px;
        }
        .secret-date {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 5px;
        }
        .secret-hall {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 3px;
        }
        .secret-loc {
            font-size: 11px;
            color: #aaa;
        }

        /* Canvas Foil Layer */
        #scratchCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: pointer;
            z-index: 5;
            transition: opacity 0.6s ease;
        }

        /* 3D Shimmer Light Beam Effect */
        .foil-shimmer {
            position: absolute;
            top: -50%; left: -60%;
            width: 40%; height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
            animation: lightBeam 4s infinite ease-in-out;
            pointer-events: none;
            z-index: 6;
        }
        @keyframes lightBeam {
            0% { left: -60%; }
            40%, 100% { left: 160%; }
        }

        /* Scratch Me Ripple & Coin Guide */
        .scratch-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: opacity 0.3s;
        }
        .scratch-coin {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe17d, #b8860b);
            border: 2px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 225, 125, 0.8);
            animation: coinPulse 1.4s infinite alternate;
        }
        @keyframes coinPulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255, 225, 125, 1); }
        }
        .scratch-guide-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #4a0d13;
            background: rgba(255,255,255,0.85);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Sparkle Particle Canvas */
        #particleCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* Countdown Section */
        .countdown-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .timer-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }
        .time-col {
            background: rgba(74, 13, 19, 0.4);
            border: 1px solid rgba(223, 168, 73, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 65px;
        }
        .time-num {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--gold-light);
        }
        .time-label {
            font-size: 10px;
            color: #bbb;
            text-transform: uppercase;
        }

        /* Venue Box */
        .venue-card {
            background: rgba(46, 8, 14, 0.5);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .venue-card h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 8px;
            font-size: 18px;
        }
        .venue-card p {
            color: #ddd;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Ambient falling petals -->
    <div class="ambient-petals" id="petals"></div>

    <!-- Music Player with song1.mp3 -->
    <button class="music-btn" id="musicBtn" onclick="toggleAudio()">
        <span>🎵 Music</span>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
    </button>
    <audio id="bgMusic" loop preload="auto">
        <source src="song1.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <h1 class="header-title">Together Forever</h1>
        <p class="sub-title">Save The Date</p>

        <!-- Cute Miniature Couple Chibi Dance -->
        <div class="couple-wrapper">
            <div class="floating-heart" style="left: 20%; animation-delay: 0s;">💖</div>
            <div class="floating-heart" style="left: 75%; animation-delay: 1.2s;">✨</div>
            <svg class="mini-couple" viewBox="0 0 200 140">
                <!-- Groom (Left) -->
                <g id="groom">
                    <circle cx="75" cy="50" r="24" fill="#ffdbac"/>
                    <path d="M51 45 C51 25, 99 25, 99 45 C95 32, 60 30, 51 45 Z" fill="#2c1a0e"/>
                    <circle cx="68" cy="50" r="3" fill="#222"/>
                    <circle cx="82" cy="50" r="3" fill="#222"/>
                    <path d="M72 58 Q75 62 78 58" stroke="#333" stroke-width="1.5" fill="none"/>
                    <path d="M52 74 L98 74 L94 130 L56 130 Z" fill="#fff" stroke="#dfa849" stroke-width="2"/>
                    <!-- Gold Neriyathu / Kasavu -->
                    <path d="M55 74 L95 125" stroke="#dfa849" stroke-width="4"/>
                </g>
                <!-- Bride (Right) -->
                <g id="bride">
                    <circle cx="125" cy="53" r="23" fill="#ffdbac"/>
                    <path d="M102 48 C102 24, 148 24, 148 48 C145 32, 108 30, 102 48 Z" fill="#2c1a0e"/>
                    <!-- Jasmine Flowers (Mulla Poo) -->
                    <circle cx="140" cy="40" r="4" fill="#fff"/>
                    <circle cx="144" cy="46" r="4" fill="#fff"/>
                    <circle cx="142" cy="52" r="4" fill="#fff"/>
                    <!-- Eyes & Smile -->
                    <circle cx="118" cy="53" r="3" fill="#222"/>
                    <circle cx="132" cy="53" r="3" fill="#222"/>
                    <circle cx="125" cy="47" r="2.5" fill="#c00"/>
                    <path d="M122 61 Q125 65 128 61" stroke="#333" stroke-width="1.5" fill="none"/>
                    <!-- Kasavu Saree -->
                    <path d="M106 76 L144 76 L148 130 L102 130 Z" fill="#fff" stroke="#dfa849" stroke-width="2"/>
                    <path d="M108 82 Q125 95 142 82" stroke="#dfa849" stroke-width="3" fill="none"/>
                </g>
            </svg>
        </div>

        <!-- Luxury Scratch Card -->
        <div class="scratch-card-box">
            <!-- Hidden details -->
            <div class="scratch-secret">
                <span class="secret-badge">💍 You're Invited</span>
                <div class="secret-date">October 24, 2026</div>
                <div class="secret-hall">EMS Community Hall</div>
                <div class="secret-loc">Alappuzha, Kerala</div>
            </div>

            <!-- Canvas for Scratching -->
            <canvas id="scratchCanvas" width="320" height="220"></canvas>

            <!-- 3D Shimmer Light Beam -->
            <div class="foil-shimmer" id="foilShimmer"></div>

            <!-- Sparkle Dust Layer -->
            <canvas id="particleCanvas" width="320" height="220"></canvas>

            <!-- Scratch Guide -->
            <div class="scratch-guide" id="scratchGuide">
                <div class="scratch-coin">🪙</div>
                <div class="scratch-guide-text">SCRATCH HERE</div>
            </div>
        </div>

        <!-- Countdown -->
        <div class="countdown-title">Counting Down To The Big Day</div>
        <div class="timer-box">
            <div class="time-col"><div class="time-num" id="d">00</div><div class="time-label">Days</div></div>
            <div class="time-col"><div class="time-num" id="h">00</div><div class="time-label">Hours</div></div>
            <div class="time-col"><div class="time-num" id="m">00</div><div class="time-label">Mins</div></div>
            <div class="time-col"><div class="time-num" id="s">00</div><div class="time-label">Secs</div></div>
        </div>

        <!-- Venue Details -->
        <div class="venue-card">
            <h3>Venue & Details</h3>
            <p><strong>EMS Community Hall</strong><br>Alappuzha, Kerala<br>2026 ഒക്ടോബർ 24</p>
        </div>
    </div>

    <script>
        // Background Audio Handling
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                }).catch(() => {});
            }
        }
        document.body.addEventListener('click', function initPlay() {
            if (!isPlaying) toggleAudio();
            document.body.removeEventListener('click', initPlay);
        }, { once: true });

        // Floating Rose Petals
        const petalContainer = document.getElementById('petals');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = (10 + Math.random() * 12) + 'px';
            p.style.height = (12 + Math.random() * 14) + 'px';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.animationDuration = (8 + Math.random() * 7) + 's';
            petalContainer.appendChild(p);
        }

        // Live Countdown to Oct 24, 2026
        const weddingDate = new Date("October 24, 2026 10:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = weddingDate - now;
            if (distance > 0) {
                document.getElementById('d').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById('h').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('m').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('s').innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }
        }, 1000);

        // Gold Foil Scratch Card + Particles
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');
        const guide = document.getElementById('scratchGuide');
        const shimmer = document.getElementById('foilShimmer');

        let isDrawing = false;
        let isRevealed = false;
        let particles = [];

        // Draw Gold Foil Surface
        function setupGoldFoil() {
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#d4af37');
            grad.addColorStop(0.3, '#f5d77f');
            grad.addColorStop(0.6, '#aa771c');
            grad.addColorStop(1, '#e6ca65');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Damask Pattern
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1.5;
            for (let i = -100; i < canvas.width + 100; i += 22) {
                ctx.beginPath();
                ctx.arc(i, 110, 40, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        setupGoldFoil();

        // Sparkle & Gold Dust Animation Loop
        function addGoldDust(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 20,
                    y: y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 1,
                    size: Math.random() * 3 + 1,
                    color: Math.random() > 0.4 ? '#ffe27d' : '#fff',
                    life: 1
                });
            }
        }

        function renderParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                pCtx.save();
                pCtx.globalAlpha = p.life;
                pCtx.fillStyle = p.color;
                pCtx.shadowBlur = 8;
                pCtx.shadowColor = '#ffd700';
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
                pCtx.restore();
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        function scratch(e) {
            if (!isDrawing || isRevealed) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();

            // Hide guide icon immediately upon scratching
            if (guide) guide.style.opacity = '0';
            if (shimmer) shimmer.style.display = 'none';

            addGoldDust(x, y);
            checkScratchPercentage();
        }

        function checkScratchPercentage() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let cleared = 0;
            for (let i = 3; i < imgData.data.length; i += 32) {
                if (imgData.data[i] === 0) cleared++;
            }
            const total = imgData.data.length / 32;
            if (cleared / total > 0.42 && !isRevealed) {
                revealCelebration();
            }
        }

        function revealCelebration() {
            isRevealed = true;
            canvas.style.opacity = '0';
            setTimeout(() => { canvas.style.display = 'none'; }, 600);

            // Celebration Blast (Confetti & Fireworks)
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#dfa849', '#ffffff', '#ff3366', '#ffd700']
                });
                setTimeout(() => {
                    confetti({
                        particleCount: 50,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#dfa849', '#f3b05a']
                    });
                    confetti({
                        particleCount: 50,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#dfa849', '#f3b05a']
                    });
                }, 300);
            }
        }

        // Mouse & Touch events
        ['mousedown', 'touchstart'].forEach(evt => {
            canvas.addEventListener(evt, (e) => {
                isDrawing = true;
                scratch(e);
            }, { passive: true });
        });

        ['mousemove', 'touchmove'].forEach(evt => {
            canvas.addEventListener(evt, (e) => {
                scratch(e);
            }, { passive: true });
        });

        ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
            window.addEventListener(evt, () => { isDrawing = false; });
        });
    </script>
</body>
</html>
