  <style>
    :root {
      --bg-cream: #fbf8f2;
      --deep-green: #0f2c27;
      --gold: #bfa15f;
      --gold-light: #dfc88b;
      --text-muted: #5e6662;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-cream);
      color: #1e2825;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* 1. Cover / Tap to Open Screen */
    #cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(15, 44, 39, 0.45), rgba(15, 44, 39, 0.6)),
                  url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      text-align: center;
      padding: 24px;
    }

    #cover.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .tagline {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 20px;
    }

    .initials {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      font-weight: 300;
    }

    .initials span {
      font-style: italic;
      color: var(--gold-light);
      font-size: 2.2rem;
    }

    .cover-date {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 45px;
      opacity: 0.9;
    }

    .btn-open {
      background: transparent;
      border: 1px solid rgba(223, 200, 139, 0.6);
      color: #ffffff;
      padding: 12px 32px;
      border-radius: 50px;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    section {
      padding: 70px 24px;
      text-align: center;
      position: relative;
    }

    /* 2. Hero Section */
    .hero-sec {
      background: radial-gradient(circle at top right, rgba(191, 161, 95, 0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(15, 44, 39, 0.08), transparent 45%);
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .sub-head {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .family-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.45rem;
      color: #4a5450;
      margin-bottom: 12px;
    }

    .couple-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      line-height: 1.15;
      font-weight: 400;
      color: #12211e;
    }

    .couple-title span {
      display: block;
      font-size: 2rem;
      color: var(--gold);
      margin: 4px 0;
      font-style: italic;
    }

    .invitation-quote {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 320px;
      margin: 30px auto 40px;
      font-weight: 300;
    }

    /* 3. Calendar Block */
    .calendar-card {
      border: 1px solid #dcd4c3;
      background: #dfcb9f;
      padding: 35px 20px;
      max-width: 320px;
      margin: 30px auto 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }

    .calendar-month {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #2b3935;
    }

    .calendar-day {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.8rem;
      line-height: 1;
      color: var(--deep-green);
      margin: 8px 0;
    }

    .calendar-footer {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3b4743;
    }

    /* 4. Story Section */
    .photo-container {
      max-width: 360px;
      margin: 0 auto;
    }

    .photo-container img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .story-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      line-height: 1.25;
      margin: 15px 0 20px;
      color: var(--deep-green);
    }

    .story-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 310px;
      margin: 0 auto;
    }

    /* 5. Countdown Strip */
    .timer-sec {
      background-color: var(--deep-green);
      color: #ffffff;
      padding: 50px 20px;
    }

    .timer-sec .sub-head {
      color: var(--gold-light);
    }

    .timer-grid {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
    }

    .time-unit {
      min-width: 60px;
    }

    .time-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .time-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }
